<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1326">
  <meta name="description" content="TaskFlow — a focused, modular single-page task manager inspired by the supplied Stitch design.">
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try {
      const savedTheme = localStorage.getItem('taskflow_theme');
      document.documentElement.classList.toggle('dark', savedTheme !== 'light');
    } catch (_) {}
  </script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation"></aside>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="main" class="main" aria-label="Task views"></main>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
